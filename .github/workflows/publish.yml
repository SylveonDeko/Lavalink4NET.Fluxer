name: Publish to NuGet

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/Lavalink4NET.Fluxer --configuration Release -p:PackageVersion=${GITHUB_REF_NAME#v} --output ./nupkg

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: Sylveon76

      - name: Publish
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
